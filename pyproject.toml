[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kdecustomizer"
version = "0.1.0"
description = "Build and apply complete KDE Plasma 6 themes from a single spec file"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6"]

[project.scripts]
kdec = "kdecustomizer.cli:main"
kdec-gui = "kdecustomizer.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
