[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kdecustomizer"
version = "0.1.17"
description = "Build and apply complete KDE Plasma 6 themes from a single spec file"
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
ai = ["anthropic>=2.8", "Pillow", "pypdf"]   # Claude API, image downscaling, PDF text for non-Claude AIs
test = ["pytest"]

[project.scripts]
kdec = "kdecustomizer.cli:main"
kdec-gui = "kdecustomizer.gui.app:main"
kde-customizer = "kdecustomizer.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
