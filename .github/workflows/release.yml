# Build every download (AppImage, .deb, .rpm, .tar.gz, and the Arch package built from the PKGBUILD),
# install each one on several distributions and check the program starts and finds its libraries,
# then on a version tag attach everything to the GitHub release.
#
# The AppImage/.deb/.rpm/.tar.gz carry their own Python + Qt (manylinux, glibc >= 2.28), so they don't
# depend on the distribution's PySide6 — which Debian 12 and Ubuntu 24.04 don't package.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  NFPM_VERSION: "2.49.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: |
          sudo apt-get update && sudo apt-get install -y python3-venv file
          curl -sSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin nfpm
      - name: Self-check (no GUI)
        run: |
          PYTHONPATH=src python3 -m kdecustomizer.cli build examples/midnight.toml -o /tmp/check >/dev/null
          bash -n /tmp/check/Midnight/install.sh
      - name: AppImage
        run: packaging/appimage/build.sh
      - name: .tar.gz, .deb, .rpm
        run: packaging/build-packages.sh
      - name: Checksums
        run: cd dist && sha256sum KDE_Customizer-*.AppImage kde-customizer* | grep -v '\.sha256' > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS

  aur:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Build tools
        run: pacman -Syu --noconfirm --needed base-devel git
      - uses: actions/checkout@v4
      - name: makepkg (from this checkout instead of the tag tarball)
        run: |
          useradd -m builder
          ver=$(sed -n 's/^pkgver=//p' packaging/aur/PKGBUILD)
          mkdir /tmp/aur
          git config --global --add safe.directory "$PWD"
          git archive --prefix="kde-customizer-$ver/" -o "/tmp/aur/kde-customizer-$ver.tar.gz" HEAD
          # local snapshot, so the pinned checksum of the tag tarball doesn't apply
          sed -e "s|^source=.*|source=(\"kde-customizer-$ver.tar.gz\")|" -e "s|^sha256sums=.*|sha256sums=('SKIP')|" \
            packaging/aur/PKGBUILD > /tmp/aur/PKGBUILD
          chown -R builder /tmp/aur
          # install the PKGBUILD's dependencies as root, then build as a normal user
          deps=$(cd /tmp/aur && bash -c 'source PKGBUILD; echo "${depends[@]} ${makedepends[@]}"')
          pacman -S --noconfirm --needed $deps
          su builder -c "cd /tmp/aur && makepkg --noconfirm"
          pacman -U --noconfirm /tmp/aur/kde-customizer-*.pkg.tar.zst
          kdec --help | head -2
          kdec build /usr/share/kde-customizer/examples/midnight.toml -o /tmp/b | tail -1
          mkdir -p arch && cp /tmp/aur/kde-customizer-*.pkg.tar.zst arch/
      # Attached to the release so Arch users can `pacman -U` it without building
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: arch/*.pkg.tar.zst

  # The login screen script for real, as root, against an SDDM install (the dev box runs Plasma Login).
  login-test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: SDDM + tools
        run: pacman -Syu --noconfirm --needed sddm kconfig python python-pyside6 util-linux
      - uses: actions/checkout@v4
      - name: Theme the SDDM login screen
        run: |
          set -euxo pipefail
          getent passwd sddm || useradd -r -m -d /var/lib/sddm -s /usr/bin/nologin sddm
          mkdir -p /var/lib/sddm /usr/share/sddm/themes/breeze /usr/share/icons
          # a cursor base with SVG cursors for [cursorset] (normally from breeze)
          python3 - <<'EOF'
          from pathlib import Path
          d = Path("/usr/share/icons/breeze_cursors")
          (d / "cursors_scalable/default").mkdir(parents=True, exist_ok=True)
          (d / "cursors").mkdir(exist_ok=True)
          (d / "index.theme").write_text("[Icon Theme]\nName=Breeze\n")
          (d / "cursors_scalable/default/default.svg").write_text(
              '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><path d="M4 4v16l4-4z" fill="#fff"/></svg>')
          (d / "cursors_scalable/default/metadata.json").write_text(
              '[{"filename": "default.svg", "hotspot_x": 4, "hotspot_y": 4, "nominal_size": 24}]')
          EOF
          cp examples/midnight.toml /tmp/t.toml
          printf 'P3\n2 2\n255\n20 21 31 20 21 31 139 124 246 139 124 246\n' > /tmp/wall.ppm
          sed -i 's#^konsole = true#konsole = true\nwallpaper = "/tmp/wall.ppm"#' /tmp/t.toml
          QT_QPA_PLATFORM=offscreen PYTHONPATH=src python3 -m kdecustomizer.cli build /tmp/t.toml -o /tmp/b | tail -1
          bash /tmp/b/Midnight/login/apply.sh /tmp/b/Midnight
          cat /etc/sddm.conf.d/kde_settings.conf /usr/share/sddm/themes/breeze/theme.conf.user
          grep -q '^Current=breeze' /etc/sddm.conf.d/kde_settings.conf
          grep -q '^CursorTheme=Midnight-Cursors' /etc/sddm.conf.d/kde_settings.conf
          grep -q '^type=image' /usr/share/sddm/themes/breeze/theme.conf.user
          test -f /usr/share/sddm/themes/breeze/kde-customizer-background.ppm
          grep -q '^name=Midnight' /var/lib/sddm/.config/plasmarc
          grep -q '^cursorTheme=Midnight-Cursors' /var/lib/sddm/.config/kcminputrc
          grep -q '^\[Colors:Window\]' /var/lib/sddm/.config/kdeglobals
          test -d /var/lib/sddm/.local/share/icons/Midnight-Cursors
          test -d /var/lib/sddm/.local/share/plasma/desktoptheme/Midnight
          test "$(stat -c %U /var/lib/sddm/.config/kdeglobals)" = sddm

  install-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:22.04", kind: deb }
          - { image: "ubuntu:24.04", kind: deb }
          - { image: "debian:12", kind: deb }
          - { image: "debian:13", kind: deb }
          - { image: "fedora:latest", kind: rpm }
          - { image: "opensuse/tumbleweed", kind: rpm }
          - { image: "archlinux:latest", kind: tar }
          - { image: "ubuntu:24.04", kind: appimage }
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - name: Install (${{ matrix.kind }})
        run: |
          set -e
          case "${{ matrix.kind }}" in
            deb)  apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ./kde-customizer_*.deb ;;
            rpm)  if command -v dnf >/dev/null; then dnf install -y ./kde-customizer-*.rpm
                  else zypper --non-interactive install --allow-unsigned-rpm ./kde-customizer-*.rpm; fi ;;
            tar)  pacman -Syu --noconfirm --needed fontconfig freetype2 libglvnd libxkbcommon-x11 wayland \
                    xcb-util-cursor xcb-util-image xcb-util-keysyms xcb-util-renderutil xcb-util-wm dbus glib2 libpng
                  tar -xzf kde-customizer-*.tar.gz
                  HOME=/root sh kde-customizer-*/install.sh --system ;;
            appimage) apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                    libfontconfig1 libfreetype6 libegl1 libgl1 libglib2.0-0t64 libdbus-1-3 libxkbcommon0
                  chmod +x KDE_Customizer-*.AppImage ;;
          esac
      - name: Programs start, build a theme, and find their libraries
        run: |
          set -e
          if [ "${{ matrix.kind }}" = appimage ]; then
            export APPIMAGE_EXTRACT_AND_RUN=1
            ./KDE_Customizer-*.AppImage --help | head -2
            ./KDE_Customizer-*.AppImage new /tmp/t.toml && ./KDE_Customizer-*.AppImage build /tmp/t.toml -o /tmp/b
            exit 0
          fi
          PATH="/usr/local/bin:$PATH"
          kdec --help | head -2
          kdec build /opt/kde-customizer/examples/midnight.toml -o /tmp/b | tail -1
          kdec icons /opt/kde-customizer/examples/midnight.toml --prompts | head -1
          # every Qt platform plugin and core library must resolve against this distro's libraries
          Q=$(ls -d /opt/kde-customizer/python/lib/python3.*/site-packages/PySide6/Qt)
          for f in "$Q"/plugins/platforms/libq{xcb,wayland,offscreen}.so "$Q"/lib/libQt6{Core,Gui,Widgets,Svg,DBus,XcbQpa,WaylandClient}.so.6; do
            ldd "$f" > /tmp/ldd || true
            if grep 'not found' /tmp/ldd; then echo "MISSING for $f"; exit 1; fi
          done
          echo "all Qt libraries resolve"
          # the GUI starts and keeps running (offscreen: no display in CI); timeout's 124 = still running
          set +e
          QT_QPA_PLATFORM=offscreen timeout 8 kdec-gui /opt/kde-customizer/examples/midnight.toml
          rc=$?
          [ "$rc" = 124 ] && echo "GUI started" || { echo "GUI exited early ($rc)"; exit 1; }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [install-test, aur, login-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: arch
          path: dist
      - name: Checksums (with the Arch package)
        run: cd dist && sha256sum KDE_Customizer-*.AppImage kde-customizer* | grep -v '\.sha256' > SHA256SUMS && cat SHA256SUMS
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "KDE Customizer ${tag#v}" \
                 --notes "Downloads for every Linux distribution — see the README for which one to pick."
          gh release upload "$tag" -R "$GITHUB_REPOSITORY" --clobber dist/*
