# .deb and .rpm packages (nfpm). Built by packaging/build-packages.sh from the staged runtime:
#   VERSION=0.1.1 nfpm package -f packaging/nfpm.yaml -p deb -t dist/   (after it has staged build/pkgroot)
# Everything lives in /opt/kde-customizer (bundled Python + Qt); /usr/bin gets symlinks.
name: kde-customizer
arch: amd64
platform: linux
version: ${VERSION}
version_schema: semver
release: 1
section: kde
priority: optional
maintainer: RJCogburn <28759507+RJCogburn@users.noreply.github.com>
description: |
  Build, preview and apply complete KDE Plasma 6 themes from one TOML spec.
  Color scheme, Plasma style, global theme, panel layout, Konsole colors, fonts and a
  matching icon set, with a live preview. Optional AI-assisted design (Claude Code,
  Claude API, OpenAI-compatible providers, local image AIs such as Fooocus/ComfyUI).
vendor: RJCogburn
homepage: https://github.com/RJCogburn/kde-customizer
license: GPL-3.0-or-later

contents:
  - src: build/pkgroot/python
    dst: /opt/kde-customizer/python
  - src: build/pkgroot/bin/kdec
    dst: /opt/kde-customizer/bin/kdec
    file_info: { mode: 0755 }
  - src: build/pkgroot/bin/kdec-gui
    dst: /opt/kde-customizer/bin/kdec-gui
    file_info: { mode: 0755 }
  - src: build/pkgroot/examples
    dst: /opt/kde-customizer/examples
  - src: /opt/kde-customizer/bin/kdec
    dst: /usr/bin/kdec
    type: symlink
  - src: /opt/kde-customizer/bin/kdec-gui
    dst: /usr/bin/kdec-gui
    type: symlink
  - src: /opt/kde-customizer/bin/kdec-gui
    dst: /usr/bin/kde-customizer
    type: symlink
  - src: packaging/kde-customizer.desktop
    dst: /usr/share/applications/kde-customizer.desktop
  - src: packaging/kde-customizer.png
    dst: /usr/share/icons/hicolor/256x256/apps/kde-customizer.png
  - src: LICENSE
    dst: /usr/share/doc/kde-customizer/LICENSE
  - src: README.md
    dst: /usr/share/doc/kde-customizer/README.md

overrides:
  deb:
    depends:
      - libc6 (>= 2.28)
      - libglib2.0-0t64 | libglib2.0-0
      - libdbus-1-3
      - libfontconfig1
      - libfreetype6
      - libegl1
      - libgl1
      - libpng16-16t64 | libpng16-16
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libx11-6
      - libx11-xcb1
      - libxcb1
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-xfixes0
      - libxcb-xkb1
      - libxkbcommon0
      - libxkbcommon-x11-0
    recommends:
      - plasma-workspace
    suggests:
      - qt6-style-kvantum   # for generated app styles ([widgets] generate)
  rpm:
    # library names rather than package names: Fedora and openSUSE name packages differently
    depends:
      - libglib-2.0.so.0()(64bit)
      - libgthread-2.0.so.0()(64bit)      # a separate package on openSUSE (libgthread-2_0-0)
      - libdbus-1.so.3()(64bit)
      - libfontconfig.so.1()(64bit)
      - libfreetype.so.6()(64bit)
      - libEGL.so.1()(64bit)
      - libGL.so.1()(64bit)
      - libpng16.so.16()(64bit)
      - libwayland-client.so.0()(64bit)
      - libwayland-cursor.so.0()(64bit)
      - libwayland-egl.so.1()(64bit)
      - libX11.so.6()(64bit)
      - libX11-xcb.so.1()(64bit)
      - libxcb.so.1()(64bit)
      - libxcb-cursor.so.0()(64bit)
      - libxcb-icccm.so.4()(64bit)
      - libxcb-image.so.0()(64bit)
      - libxcb-keysyms.so.1()(64bit)
      - libxcb-randr.so.0()(64bit)
      - libxcb-render-util.so.0()(64bit)
      - libxcb-shape.so.0()(64bit)
      - libxcb-xfixes.so.0()(64bit)
      - libxcb-xkb.so.1()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libxkbcommon-x11.so.0()(64bit)
    recommends:
      - plasma-workspace
    suggests:
      - kvantum             # for generated app styles ([widgets] generate)
