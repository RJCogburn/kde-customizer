id = "org.kdecustomizer.sandstone"
name = "Sandstone"
author = ""
description = "Sunny beige with a terracotta accent"
version = "1.0"
icons = "breeze"
cursors = "breeze_cursors"
widget_style = "Breeze"
plasma_style = "default"
splash = "org.kde.Breeze"
wallpaper = ""
konsole = true

[palette]
background = "#f4efe6"
surface = "#e9e1d3"
foreground = "#2a241c"
accent = "#b5532a"
positive = "#3d7d3a"
neutral = "#8a6508"
negative = "#b42318"
link = ""
visited = ""

[plasma]
generate = true
blur = true
adaptive_transparency = true
radius = 10
opacity = 0.88
outline = false

[iconset]
generate = false
base = "Papirus-Dark"
signature = "none"
style = ""
signature_dir = ""
app_icons = "keep"

[cursorset]
generate = false
base = "breeze_cursors"
fill = "background"

[widgets]
generate = false
radius = 4

[decoration]
library = "org.kde.breeze"
theme = "Breeze"
buttons_left = "M"
buttons_right = "IAX"
generate = true
radius = 10
title_height = 30
title_align = "center"
border = 2
button_style = "glyph"

[splash_screen]
generate = true
background = "gradient"
text = ""

[login_screen]
generate = false
background = "wallpaper"
clock = true

[boot_splash]
generate = false
background = "gradient"
text = ""

[gtk]
generate = true
flatpak = false

[apps]
kitty = true
alacritty = true
wezterm = true
ghostty = true
vscode = true
firefox = true
thunderbird = true

[light_dark]
auto = false

[fonts]
general = ""
fixed = ""
small = ""
toolbar = ""
menu = ""
window_title = ""

[[panels]]
location = "top"
height = 32
floating = false
alignment = "center"
length_mode = "fill"
widgets = ["org.kde.plasma.kickoff", "org.kde.plasma.panelspacer", "org.kde.plasma.digitalclock", "org.kde.plasma.panelspacer", "org.kde.plasma.systemtray"]

[[panels]]
location = "bottom"
height = 54
floating = true
alignment = "center"
length_mode = "fit"
widgets = ["org.kde.plasma.icontasks"]
