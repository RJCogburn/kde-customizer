id = "org.kdecustomizer.forest"
name = "Forest"
author = ""
description = "Dark pine greens with a warm amber accent"
version = "1.0"
icons = "breeze-dark"
cursors = "breeze_cursors"
widget_style = "Breeze"
plasma_style = "default"
splash = "org.kde.Breeze"
wallpaper = ""
konsole = true

[palette]
background = "#121a16"
surface = "#1a251f"
foreground = "#e2ebe4"
accent = "#e8a849"
positive = "#6fcf7f"
neutral = "#e3c34d"
negative = "#ec7063"
link = ""
visited = ""

[plasma]
generate = true
blur = true
adaptive_transparency = true
radius = 10
opacity = 0.82
outline = false

[iconset]
generate = false
base = "Papirus-Dark"
signature = "none"
style = ""
signature_dir = ""
app_icons = "keep"

[cursorset]
generate = false
base = "breeze_cursors"
fill = "background"

[widgets]
generate = false
radius = 4

[decoration]
library = "org.kde.breeze"
theme = "Breeze"
buttons_left = "XIA"
buttons_right = ""
generate = true
radius = 10
title_height = 30
title_align = "center"
border = 2
button_style = "dots"

[splash_screen]
generate = true
background = "gradient"
text = ""

[login_screen]
generate = false
background = "wallpaper"
clock = true

[boot_splash]
generate = false
background = "gradient"
text = ""

[gtk]
generate = true
flatpak = false

[apps]
kitty = true
alacritty = true
wezterm = true
ghostty = true
vscode = true
firefox = true
thunderbird = true

[light_dark]
auto = false

[fonts]
general = ""
fixed = ""
small = ""
toolbar = ""
menu = ""
window_title = ""

[[panels]]
location = "top"
height = 32
floating = false
alignment = "center"
length_mode = "fill"
widgets = ["org.kde.plasma.kickoff", "org.kde.plasma.panelspacer", "org.kde.plasma.digitalclock", "org.kde.plasma.panelspacer", "org.kde.plasma.systemtray"]

[[panels]]
location = "bottom"
height = 54
floating = true
alignment = "center"
length_mode = "fit"
widgets = ["org.kde.plasma.icontasks"]
