id = "org.kdecustomizer.mint"
name = "Mint"
author = ""
description = "Fresh pale green-gray with a leafy green accent"
version = "1.0"
icons = "breeze"
cursors = "breeze_cursors"
widget_style = "Breeze"
plasma_style = "default"
splash = "org.kde.Breeze"
wallpaper = ""
konsole = true

[palette]
background = "#f1f5f2"
surface = "#e3ebe5"
foreground = "#1b2420"
accent = "#17803d"
positive = "#1f7a3a"
neutral = "#8a6a00"
negative = "#c0362c"
link = ""
visited = ""

[plasma]
generate = true
blur = true
adaptive_transparency = true
radius = 6
opacity = 0.9
outline = false

[iconset]
generate = false
base = "Papirus-Dark"
signature = "none"
style = ""
signature_dir = ""
app_icons = "keep"

[cursorset]
generate = false
base = "breeze_cursors"
fill = "background"

[widgets]
generate = false
radius = 4

[decoration]
library = "org.kde.breeze"
theme = "Breeze"
buttons_left = "M"
buttons_right = "IAX"
generate = true
radius = 6
title_height = 30
title_align = "left"
border = 2
button_style = "glyph"

[splash_screen]
generate = true
background = "gradient"
text = ""

[login_screen]
generate = false
background = "wallpaper"
clock = true

[boot_splash]
generate = false
background = "gradient"
text = ""

[gtk]
generate = true
flatpak = false

[apps]
kitty = true
alacritty = true
wezterm = true
ghostty = true
vscode = true
firefox = true
thunderbird = true

[light_dark]
auto = false

[fonts]
general = ""
fixed = ""
small = ""
toolbar = ""
menu = ""
window_title = ""

[[panels]]
location = "bottom"
height = 44
floating = false
alignment = "center"
length_mode = "fill"
widgets = ["org.kde.plasma.kickoff", "org.kde.plasma.pager", "org.kde.plasma.icontasks", "org.kde.plasma.marginsseparator", "org.kde.plasma.systemtray", "org.kde.plasma.digitalclock", "org.kde.plasma.showdesktop"]
