id = "org.kdecustomizer.midnight"
name = "Midnight"
author = ""
description = "Deep indigo dark theme with a violet accent"
version = "1.0"
icons = "breeze-dark"
cursors = "breeze_cursors"
widget_style = "Breeze"
plasma_style = "default"
splash = "org.kde.Breeze"
wallpaper = ""
konsole = true

[palette]
background = "#14151f"
surface = "#1d1f2d"
foreground = "#e4e4f0"
accent = "#8b7cf6"
positive = "#4ade80"
neutral = "#facc15"
negative = "#f87171"
link = ""
visited = ""

[plasma]
generate = true
blur = true
adaptive_transparency = true
radius = 12
opacity = 0.8
outline = false

[iconset]
generate = false
base = "Papirus-Dark"
signature = "none"
style = ""
signature_dir = ""
app_icons = "keep"

[cursorset]
generate = false
base = "breeze_cursors"
fill = "background"

[widgets]
generate = false
radius = 4

[decoration]
library = "org.kde.breeze"
theme = "Breeze"
buttons_left = "M"
buttons_right = "IAX"
generate = true
radius = 12
title_height = 30
title_align = "center"
border = 2
button_style = "glyph"

[splash_screen]
generate = true
background = "gradient"
text = ""

[login_screen]
generate = false
background = "wallpaper"
clock = true

[boot_splash]
generate = false
background = "gradient"
text = ""

[gtk]
generate = true
flatpak = false

[apps]
kitty = true
alacritty = true
wezterm = true
ghostty = true
vscode = true
firefox = true
thunderbird = true

[light_dark]
auto = false

[fonts]
general = ""
fixed = ""
small = ""
toolbar = ""
menu = ""
window_title = ""

[[panels]]
location = "bottom"
height = 46
floating = true
alignment = "center"
length_mode = "fit"
widgets = ["org.kde.plasma.kickoff", "org.kde.plasma.icontasks", "org.kde.plasma.marginsseparator", "org.kde.plasma.systemtray", "org.kde.plasma.digitalclock"]
